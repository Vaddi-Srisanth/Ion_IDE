name: Phase 2 build tasks native acceptance (no publication)
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native platform set to verify
        type: choice
        options: [all, windows]
        default: all
permissions:
  contents: read
concurrency:
  group: phase2-tasks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tasks:
    name: Native ${{ matrix.os }} build tasks
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'windows' && '["windows-2025"]' || '["macos-15","windows-2025"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      ION_TASKS_APPLICATION_SHA: d5d89e19b6a10b0727071c2283c6774baf1b842d
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.2
          cache: npm
      - name: Verify immutable application source and native host
        run: |
          mkdir -p performance-results/phase2-tasks
          git cat-file -e "$ION_TASKS_APPLICATION_SHA^{commit}"
          git diff --exit-code "$ION_TASKS_APPLICATION_SHA" HEAD -- src package.json package-lock.json test/tasks.test.ts
          {
            printf 'application_sha=%s\nverification_sha=%s\n' "$ION_TASKS_APPLICATION_SHA" "$(git rev-parse HEAD)"
            node -e 'const expected=process.platform==="darwin"?"arm64":"x64";if(process.arch!==expected)throw Error(`Expected ${expected}, got ${process.arch}`);console.log(JSON.stringify({node:process.version,platform:process.platform,arch:process.arch,release:require("os").release()}))'
            node --version
            npm --version
          } > performance-results/phase2-tasks/identity.log 2>&1
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Record exact task tool versions
        run: |
          {
            node --version
            npm --version
            node -p 'process.execPath'
            npm root -g
          } > performance-results/phase2-tasks/tools.log 2>&1
      - name: Type-check and build exact production candidate
        run: |
          npm run typecheck 2>&1 | tee performance-results/phase2-tasks/typecheck.log
          npm run build 2>&1 | tee performance-results/phase2-tasks/build.log
      - name: Full unit and security regression
        run: npm test 2>&1 | tee performance-results/phase2-tasks/unit.log
      - name: Focused task model and lifecycle tests
        run: node scripts/test.mjs tasks 2>&1 | tee performance-results/phase2-tasks/tasks-unit.log
      - name: Production Electron task journey and resource cleanup
        id: desktop_tasks
        continue-on-error: true
        run: node scripts/test-tasks-desktop.mjs 2>&1 | tee performance-results/phase2-tasks/desktop-tasks.log
      - name: Record acceptance result
        if: always()
        env:
          DESKTOP_RESULT: ${{ steps.desktop_tasks.outcome }}
        run: printf 'desktop_result=%s\n' "$DESKTOP_RESULT" > performance-results/phase2-tasks/acceptance-result.log
      - name: Prove immutable source and collect bounded evidence
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          node --input-type=module <<'NODE'
          import { mkdir, open, readdir, writeFile } from 'node:fs/promises';
          import { homedir, tmpdir } from 'node:os';
          import { join } from 'node:path';
          const source='performance-results/phase2-tasks', destination='performance-results/phase2-tasks-safe';
          await mkdir(destination,{recursive:true});
          for(const name of await readdir(source).catch(()=>[])) {
            let handle; try { handle=await open(join(source,name),'r'); } catch { continue; }
            try {
              const size=(await handle.stat()).size; if(size>16*1024*1024) throw Error(`${name} exceeded 16 MiB`);
              const bytes=Buffer.alloc(size); await handle.read(bytes,0,size,0); let text=bytes.toString('utf8');
              for(const [value,label] of [[process.cwd(),'<checkout>'],[tmpdir(),'<tmp>'],[homedir(),'<home>']])
                for(const spelling of new Set([value,value.replaceAll('\\','/')])) text=text.split(spelling).join(label);
              await writeFile(join(destination,name),text);
            } finally { await handle.close(); }
          }
          if(!(await readdir(destination)).length) throw Error('No build-task evidence was collected.');
          NODE
      - name: Enforce task acceptance result
        if: always()
        env:
          DESKTOP_RESULT: ${{ steps.desktop_tasks.outcome }}
        run: test "$DESKTOP_RESULT" = success
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: phase2-tasks-${{ matrix.os }}-${{ github.sha }}
          path: performance-results/phase2-tasks-safe/*
          if-no-files-found: error
          retention-days: 7
