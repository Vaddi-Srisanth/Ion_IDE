name: Phase 10 Windows workspace search repro
on:
  workflow_dispatch:
  push:
    branches: [codex/ion-phase-6-copilot]
    paths:
      - '.github/workflows/phase10-workspace-search-windows.yml'
      - 'src/main/workspace-search.ts'
      - 'src/renderer/WorkspaceSearch.tsx'
      - 'scripts/test-workspace-search.mjs'
      - 'test/workspace-search.test.ts'
permissions:
  contents: read
jobs:
  workspace-search:
    name: Production workspace search on Windows x64
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.2
          cache: npm
      - name: Build the unpackaged candidate
        env:
          EXPECTED_PLATFORM: win32
          EXPECTED_ARCH: x64
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node -e "const a=require('node:assert/strict');a.equal(process.platform,process.env.EXPECTED_PLATFORM);a.equal(process.arch,process.env.EXPECTED_ARCH)"
          npm ci
          node node_modules/electron/install.js
          npm run typecheck
          npm run build
      - name: Verify workspace-search rules
        run: node scripts/test.mjs workspace-search
      - name: Exercise the production offline search journey and cleanup
        if: ${{ !cancelled() }}
        env:
          ION_SHOW_TEST_WINDOWS: '0'
        run: node scripts/test-workspace-search.mjs --target dist
      - name: Verify tracked files
        run: git diff --exit-code HEAD
