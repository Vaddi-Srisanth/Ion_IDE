name: Phase 10 Windows regression
on:
  workflow_dispatch:
  push:
    branches: [codex/ion-phase-6-copilot]
    paths:
      - '.github/workflows/phase10-windows-regression.yml'
      - 'src/**'
      - 'scripts/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
jobs:
  windows-regression:
    name: Full Windows x64 regression without packaging
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.2
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.3'
      - name: Build the unpackaged candidate
        env:
          EXPECTED_PLATFORM: win32
          EXPECTED_ARCH: x64
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node -e "const a=require('node:assert/strict');a.equal(process.platform,process.env.EXPECTED_PLATFORM);a.equal(process.arch,process.env.EXPECTED_ARCH)"
          npm ci
          node node_modules/electron/install.js
          npm run typecheck
          npm run build
      - name: Run Phase 10 full regression chain
        env:
          ION_SHOW_TEST_WINDOWS: '0'
        run: npm run test:regression
      - name: Verify tracked files
        run: git diff --exit-code HEAD
