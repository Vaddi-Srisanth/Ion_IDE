name: Phase 5 reviewed provider transport
on:
  workflow_dispatch:
  push:
    branches: [codex/ion-phase-5-providers]
    paths:
      - '.github/workflows/phase5-providers.yml'
      - 'src/**'
      - 'scripts/**'
      - 'test/**'
permissions:
  contents: read
jobs:
  provider:
    name: Reviewed explanations on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, platform: darwin, arch: arm64 }
          - { os: windows-2025, platform: win32, arch: x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.2
          cache: npm
      - name: Build the candidate
        id: build
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node -e "const a=require('node:assert/strict');a.equal(process.platform,process.env.EXPECTED_PLATFORM);a.equal(process.arch,process.env.EXPECTED_ARCH)"
          npm ci
          node node_modules/electron/install.js
          npm run typecheck
          npm run build
      - name: Verify reviewed context, consent and response integrity
        run: node scripts/test.mjs explanation-context explanation-editor-context explanation-provider explanation-stream explanation-renderer explanation-session projects
      - name: Exercise the production explanation dialog with a synthetic provider
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          ION_SHOW_TEST_WINDOWS: '0'
        run: node scripts/test-explanations.mjs --target dist
      - name: Verify tracked files
        run: git diff --exit-code HEAD
