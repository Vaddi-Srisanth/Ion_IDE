name: Windows GCC diagnostics (manual verification branch)

# This existing, registered path is a branch-only manual dispatch bridge.
# The main branch and its release/build workflows are unchanged.
on:
  workflow_dispatch:
    inputs:
      samples:
        description: Warm attempts per lane per isolated runner
        type: choice
        options: ['100', '30']
        default: '100'

permissions:
  contents: read

jobs:
  windows-gcc-diagnostics:
    uses: ./.github/workflows/windows-gcc-diagnostic.yml
    with:
      samples: ${{ inputs.samples || '100' }}
