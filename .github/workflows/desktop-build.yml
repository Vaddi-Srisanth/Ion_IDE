name: Desktop verification

# Source delivery runs the existing native gates. Publication remains separate.
on:
  push:
    branches: [main, codex/ion-stabilization-delivery, feature/ion-next-generation]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: Diagnostic repetition or full application release gates
        type: choice
        options: ['diagnostic', 'release', 'all', 'performance', 'follow-up', 'git-checks', 'startup']
        default: 'diagnostic'
      samples:
        description: Warm attempts per lane per isolated runner
        type: choice
        options: ['100', '30']
        default: '100'

permissions:
  contents: read

jobs:
  focused-learning-verification:
    if: github.ref_name == 'feature/ion-next-generation'
    name: Practical learning (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.2
          cache: npm
      - name: Select installed Windows compilers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gcc = 'C:\mingw64\bin'
          if (!(Test-Path (Join-Path $gcc 'gcc.exe'))) { throw 'GCC unavailable.' }
          $gcc >> $env:GITHUB_PATH
          $jdk = $env:JAVA_HOME_21_X64
          if (!$jdk -or !(Test-Path (Join-Path $jdk 'bin\javac.exe'))) { throw 'JDK 21 unavailable.' }
          "JAVA_HOME=$jdk" >> $env:GITHUB_ENV
          Join-Path $jdk 'bin' >> $env:GITHUB_PATH
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run build
      - name: Verify fixture process ownership
        run: node --test scripts/fixture-process-runner.test.mjs
      - name: Verify bounded diagnostic and measurement controls
        run: node --test scripts/desktop-startup-observer.test.mjs scripts/collect-release-gate-evidence.test.mjs scripts/test-update-preferences-support.mjs scripts/test-run-completion.mjs
      - name: Verify actual offline practical learning
        run: node scripts/test-practical-learning.mjs --require-toolchains --out performance-results/practical-learning.json
      - name: Verify actual offline Project Lens
        if: ${{ !cancelled() }}
        run: node scripts/test-project-lens.mjs --out performance-results/project-lens-native.json
      - name: Verify direct learning diagnostics and preserved content
        if: ${{ !cancelled() }}
        run: node scripts/test-learning-marketplace.mjs --out performance-results/direct-learning.json
      - name: Collect bounded sanitized evidence
        if: always()
        run: node scripts/collect-release-gate-evidence.mjs --rootperformance performance-results --out "${{ runner.temp }}/ion-learning-safe"
      - name: Upload evidence only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: focused-learning-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ion-learning-safe/**
          if-no-files-found: error
          retention-days: 14
  windows-gcc-diagnostics:
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'diagnostic' || inputs.suite == 'all')
    uses: ./.github/workflows/windows-gcc-diagnostic.yml
    with:
      samples: ${{ inputs.samples || '100' }}
  full-release-verification:
    needs: windows-gcc-diagnostics
    if: ${{ always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.suite == 'release' || inputs.suite == 'performance' || inputs.suite == 'follow-up' || (inputs.suite == 'all' && needs.windows-gcc-diagnostics.result == 'success')) }}
    uses: ./.github/workflows/ion-release-verification.yml
    with:
      performance_only: ${{ inputs.suite == 'performance' }}
      follow_up_only: ${{ inputs.suite == 'follow-up' }}
      retain_installers: ${{ github.ref_name != 'feature/ion-next-generation' }}
  windows-git-verification:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'git-checks'
    uses: ./.github/workflows/windows-git-supplement.yml
  paired-startup-verification:
    if: inputs.suite == 'startup'
    uses: ./.github/workflows/paired-startup-verification.yml
