name: Windows native performance candidate
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.22.2
          cache: npm
      - name: Locate GCC
        shell: pwsh
        run: |
          $gcc = (Get-Command gcc.exe -ErrorAction Stop).Source
          Write-Host $gcc
          Split-Path $gcc >> $env:GITHUB_PATH
      - run: npm ci
      - run: npm run build
      - run: node scripts/benchmark-windows.mjs --label candidate --terminal
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: windows-performance-candidate
          path: performance-results/windows-candidate.json
          if-no-files-found: error
          retention-days: 14
