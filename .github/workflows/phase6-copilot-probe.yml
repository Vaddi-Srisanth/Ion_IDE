name: Copilot signed-out protocol check
on:
  workflow_dispatch:
  push:
    branches: [codex/ion-phase-6-copilot]
    paths: ['.github/workflows/phase6-copilot-probe.yml', 'scripts/test-copilot-availability.mjs', 'test/fixtures/copilot-availability.cjs']
permissions:
  contents: read
jobs:
  probe:
    name: Signed-out protocol on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin-arm64
            binary: copilot-language-server
            sha512: 'tL34Jav+uY4jYGNjX+9BuD8c8+3fhinMtSYaGIXZZcUasTNAZvMEN4XDQJbPit0Ad896sbuUOEbnMii69+IhZg=='
          - os: windows-2025
            platform: win32-x64
            binary: copilot-language-server.exe
            sha512: '/fVvw60gZJoU2XCTddtIrkiern8NEp+MgxtZe1DlAdEVH4OrWRbquE68Iq3CLes0ZPhIEnCFp3Dfi/qJUwv1dQ=='
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.2
          cache: npm
      - name: Prepare test harness
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci
      - name: Verify and extract the platform-specific official binary
        env:
          SELECTED_PLATFORM: ${{ matrix.platform }}
          BINARY: ${{ matrix.binary }}
          PACKAGE_HASH: ${{ matrix.sha512 }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Windows" ]]; then export MSYS_NO_PATHCONV=1; fi
          node -e "require('node:assert/strict').equal(process.platform+'-'+process.arch,process.env.SELECTED_PLATFORM)"
          directory="$(node -p 'require("node:fs").mkdtempSync(require("node:path").join(process.env.RUNNER_TEMP,"ion-copilot-probe-"))')"
          cd "$directory"
          package="copilot-language-server-$SELECTED_PLATFORM"
          curl --proto '=https' --fail --silent --show-error --max-time 120 \
            "https://registry.npmjs.org/@github/$package/-/$package-1.575.0.tgz" --output server.tgz
          node --input-type=module -e 'import {createHash} from "node:crypto";import {createReadStream} from "node:fs";import assert from "node:assert/strict";const hash=createHash("sha512");for await(const bytes of createReadStream("server.tgz")) hash.update(bytes);assert.equal(hash.digest("base64"),process.env.PACKAGE_HASH)'
          tar -xzf server.tgz "package/$BINARY" package/package.json
          node -e "const a=require('node:assert/strict'),p=require('./package/package.json');a.equal(p.version,'1.575.0');a.equal(p.name,'@github/copilot-language-server-'+process.env.SELECTED_PLATFORM);a.equal(p.license,'MIT')"
          node -e "const fs=require('node:fs'),p=require('node:path').resolve('package',process.env.BINARY);fs.appendFileSync(process.env.GITHUB_ENV,'ION_COPILOT_PROBE_BINARY='+p+'\n')"
      - name: Block outbound connections by the Windows test binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-NetFirewallRule -DisplayName 'Ion signed-out Copilot probe' -Direction Outbound -Program $env:ION_COPILOT_PROBE_BINARY -Action Block -Profile Any | Out-Null
      - name: Initialize, check signed-out status and close
        run: node scripts/test-copilot-availability.mjs "$ION_COPILOT_PROBE_BINARY"
