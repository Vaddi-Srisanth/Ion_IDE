name: Core backup lifecycle and matched resources (no publication)
# The dedicated branch is uploaded only after explicit user approval. A scoped
# push trigger avoids needing to put this new workflow on main for dispatch.
# Prior preflight/Undo cohorts are preserved in runs 43922635358/43925166585.
# This prepared remaining-gates lane requires fresh explicit upload approval.
on:
  push:
    branches: [codex/ion-master-plan-phase-0]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-backup-${{ github.ref }}
  cancel-in-progress: false
jobs:
  backup:
    name: Disposable ${{ matrix.os }} profile
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, existing repository pin
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, existing repository pin
        with:
          node-version: 24.22.2
          cache: npm
      - name: Record exact candidate and host (no environment dump)
        run: |
          mkdir -p performance-results/core-native-acceptance
          git rev-parse HEAD > performance-results/core-native-acceptance/revision.log
          node -e 'if(process.platform==="win32" && process.arch!=="x64") throw Error("Windows x64 is required"); console.log(JSON.stringify({node:process.version,platform:process.platform,arch:process.arch}))' >> performance-results/core-native-acceptance/revision.log
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Select existing Windows GCC (no new toolchain installation)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gcc = 'C:\mingw64\bin'
          if (!(Test-Path (Join-Path $gcc 'gcc.exe'))) { throw 'The runner GCC toolchain is unavailable; do not substitute or retry.' }
          $gcc >> $env:GITHUB_PATH
      - name: Confirm production identity and exact pre-feature baseline
        run: |
          git fetch --depth=1 origin 881ef00982649b9a26a547b7fab16851e4e04871
          git fetch --depth=1 origin d67613a1e9b77c7d677bd304628d57c58542fa71
          git diff --exit-code 881ef00982649b9a26a547b7fab16851e4e04871 HEAD -- src package.json package-lock.json
          git rev-parse HEAD HEAD:src 881ef00982649b9a26a547b7fab16851e4e04871:src d67613a1e9b77c7d677bd304628d57c58542fa71:src >> performance-results/core-native-acceptance/revision.log
      # The unchanged four harness controls passed on both OSs in run 43937220557.
      # This follow-up does not repeat them or the earlier regression/Undo cohorts.
      - name: Build the exact production candidate
        run: npm run build 2>&1 | tee performance-results/core-native-acceptance/build.log
      - name: Build the ancestor's ordinary production configuration (not build baseline mode)
        run: |
          baseline_dir="$RUNNER_TEMP/ion-pre-core-baseline"
          mkdir "$baseline_dir"
          git archive d67613a1e9b77c7d677bd304628d57c58542fa71 | (
            cd "$baseline_dir"
            tar -xf -
          )
          node --input-type=module - "$baseline_dir" <<'NODE'
          import { symlink } from 'node:fs/promises';
          import { resolve, join } from 'node:path';
          await symlink(resolve('node_modules'), join(process.argv[2], 'node_modules'), process.platform === 'win32' ? 'junction' : 'dir');
          NODE
          (
            cd "$baseline_dir"
            node scripts/build.mjs
          ) 2>&1 | tee performance-results/core-native-acceptance/baseline-build.log
          echo "ION_CORE_BASELINE_DIST=$baseline_dir/dist" >> "$GITHUB_ENV"
      - name: Place both immutable build artifacts on the same benchmark filesystem
        run: |
          comparison_root="$RUNNER_TEMP/ion-core-comparison"
          node --input-type=module - "$ION_CORE_BASELINE_DIST" dist "$comparison_root" <<'NODE'
          import { cp, lstat, mkdir, rm } from 'node:fs/promises';
          import { join, resolve } from 'node:path';
          const [baseline, candidate, root] = process.argv.slice(2).map(value => resolve(value));
          const temporaryPrefix = resolve(process.env.RUNNER_TEMP) + (process.platform === 'win32' ? '\\' : '/');
          if (!root.startsWith(temporaryPrefix)) throw new Error('Unsafe comparison root.');
          await rm(root, { recursive: true, force: true });
          await mkdir(root, { recursive: true });
          await Promise.all([
            cp(baseline, join(root, 'baseline'), { recursive: true }),
            cp(candidate, join(root, 'candidate'), { recursive: true }),
          ]);
          const devices = await Promise.all([root, join(root, 'baseline'), join(root, 'candidate')].map(async path => (await lstat(path)).dev));
          if (new Set(devices).size !== 1) throw new Error('Benchmark artifacts are not on one filesystem.');
          NODE
          echo "ION_CORE_BASELINE_DIST=$comparison_root/baseline" >> "$GITHUB_ENV"
          echo "ION_CORE_CANDIDATE_DIST=$comparison_root/candidate" >> "$GITHUB_ENV"
      # The complete lifecycle already passed at c530644 in run 45205283873.
      # This diagnostic cohort isolates performance and does not repeat it.
      - name: Serialized paired one-file and backup lifecycle resources
        run: node scripts/benchmark-core-backup-native.mjs "$ION_CORE_BASELINE_DIST" "$ION_CORE_CANDIDATE_DIST" 2>&1 | tee performance-results/core-native-acceptance/metrics.log
      - name: Preserve bounded sanitized logs even on failure
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { mkdir, open, writeFile, realpath } from 'node:fs/promises';
          import { tmpdir, homedir } from 'node:os';
          import { join } from 'node:path';
          const source = 'performance-results/core-native-acceptance', destination = 'performance-results/core-native-safe';
          await mkdir(destination, {recursive:true});
          for (const name of ['revision.log','harness.log','build.log','baseline-build.log','acceptance.log','metrics.log','restore-lifecycle.json','paired-resources.json']) {
            let handle;
            try { handle = await open(join(source,name), 'r'); }
            catch (error) { if (error.code === 'ENOENT') { await writeFile(join(destination,name), 'NOT RUN / no log produced\n'); continue; } throw error; }
            const limit = (name.endsWith('.json') ? 16 : 2) * 1024 * 1024;
            let text;
            try {
              const size = (await handle.stat()).size;
              if (name.endsWith('.json') && size > limit) throw new Error('Structured evidence exceeded its 16 MiB bound; do not silently truncate samples.');
              const buffer = Buffer.alloc(Math.min(size,limit));
              let offset = 0;
              while (offset < buffer.length) { const read = await handle.read(buffer,offset,buffer.length-offset,offset); if (!read.bytesRead) break; offset += read.bytesRead; }
              text = buffer.subarray(0,offset).toString() + (size > limit ? '\n[TRUNCATED: log exceeded 2 MiB; preserve original failure in the job console]\n' : '');
            } finally { await handle.close(); }
            for (const [path,label] of [[process.cwd(),'<checkout>'],[tmpdir(),'<tmp>'],[await realpath(tmpdir()),'<tmp>'],[homedir(),'<home>']]) {
              for (const spelling of new Set([path,path.replaceAll('\\','/')])) text = text.split(spelling).join(label);
            }
            await writeFile(join(destination,name),text);
          }
          NODE
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, existing repository pin
        if: always()
        with:
          name: core-native-${{ matrix.os }}-${{ github.sha }}
          path: performance-results/core-native-safe/*
          if-no-files-found: error
          retention-days: 7
