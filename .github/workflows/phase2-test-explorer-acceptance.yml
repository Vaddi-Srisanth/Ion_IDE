name: Phase 2 Test Explorer native acceptance
on:
  push:
    branches: [codex/ion-core-excellence-phase-2-tests]
    paths:
      - '.github/workflows/phase2-test-explorer-acceptance.yml'
      - 'src/**'
      - 'scripts/**'
      - 'test/**'
      - 'package*.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: phase2-test-explorer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Test Explorer on ${{ matrix.os }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, platform: darwin, arch: arm64 }
          - { os: windows-2025, platform: win32, arch: x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.2
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.3'
      - name: Verify revision and native host
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node - <<'NODE'
          const assert = require('node:assert/strict')
          assert.equal(process.platform, process.env.EXPECTED_PLATFORM)
          assert.equal(process.arch, process.env.EXPECTED_ARCH)
          console.log(process.env.GITHUB_SHA, process.platform, process.arch, process.version)
          NODE
      - name: Build and type-check production Ion
        id: build
        run: |
          npm ci
          node node_modules/electron/install.js
          npm run typecheck
          npm run build
          node - <<'NODE'
          const { accessSync } = require('node:fs')
          const suffix = process.platform === 'win32' ? '.exe' : ''
          accessSync('dist/main/test-explorer/service.cjs')
          for (const name of ['ion-pty', 'ion-file-ops']) accessSync('dist/native/' + name + suffix)
          NODE
      - name: Provision isolated framework tools
        id: tools
        shell: python
        run: |
          import hashlib, os, subprocess, sys, urllib.request
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'ion-framework-tools'
          root.mkdir()
          windows = sys.platform == 'win32'
          jdk = Path(os.environ['JAVA_HOME_21_X64' if windows else 'JAVA_HOME_21_arm64'])
          subprocess.run([jdk / 'bin' / ('javac.exe' if windows else 'javac'), '-version'], check=True)
          venv = root / 'pytest'
          subprocess.run([sys.executable, '-m', 'venv', venv], check=True)
          python = venv / ('Scripts/python.exe' if windows else 'bin/python3')
          subprocess.run([python, '-m', 'pip', 'install', '--disable-pip-version-check', '--only-binary=:all:', 'pytest==8.4.2'], check=True)
          subprocess.run([python, '-I', '-m', 'pytest', '--version'], check=True)

          jar = root / 'junit-platform-console-standalone-1.13.4.jar'
          url = 'https://repo.maven.apache.org/maven2/org/junit/platform/junit-platform-console-standalone/1.13.4/' + jar.name
          urllib.request.urlretrieve(url, jar)
          assert hashlib.sha256(jar.read_bytes()).hexdigest() == '3fdfc37e29744a9a67dd5365e81467e26fbde0b7aa204e6f8bbe79eeaa7ae892'
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              for key, path in {'JAVA_HOME': jdk, 'ION_TEST_PYTEST_PYTHON': python, 'ION_TEST_VITEST_PROJECT': root / 'vitest', 'ION_JUNIT_PLATFORM_JAR': jar}.items():
                  print(f'{key}={path}', file=env)
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as paths:
              print(python.parent, file=paths)
              print(jdk / 'bin', file=paths)
      - name: Install pinned project-local Vitest fixture
        run: npm install --prefix "$ION_TEST_VITEST_PROJECT" --no-save --no-package-lock --no-audit --no-fund vitest@4.1.0
      - name: Test adapters, approval, history and backup
        env:
          NODE_OPTIONS: --test-reporter=tap
        run: |
          node scripts/test.mjs test-explorer test-explorer-pytest test-explorer-vitest test-explorer-junit test-explorer-backup | tee "$RUNNER_TEMP/ion-test-explorer.tap"
          grep -Eq '^# skipped 0[[:space:]]*$' "$RUNNER_TEMP/ion-test-explorer.tap"
      - name: Drive real pytest in the production desktop app
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.tools.outcome == 'success' }}
        run: node scripts/test-test-explorer-desktop.mjs
      - name: Verify tracked files and record candidate
        run: |
          git diff --exit-code HEAD
          printf 'Test Explorer passed on %s %s at %s.\n' "$RUNNER_OS" "$RUNNER_ARCH" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
